
<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TaskTracker — Мої завдання</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #f1f5f9;
      font-family: Arial, sans-serif;
      color: #172033;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 520px;
      background: white;
      padding: 35px;
      border-radius: 20px;
      box-shadow: 0 12px 35px rgba(0, 0, 0, 0.08);
    }

    h1 {
      margin: 0 0 10px;
      font-size: 30px;
    }

    p {
      color: #64748b;
      line-height: 1.5;
    }

    button {
      width: 100%;
      padding: 14px;
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      cursor: pointer;
      margin-top: 15px;
    }

    button:hover {
      background: #1d4ed8;
    }

    button:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    ul {
      list-style: none;
      padding: 0;
      margin-top: 22px;
    }

    li {
      padding: 15px;
      margin-bottom: 10px;
      border-radius: 10px;
      background: #f8fafc;
      border: 1px solid #e2e8f0;
    }

    #status {
      font-size: 14px;
    }
  </style>
</head>

<body>
  <main class="container">
    <h1>TaskTracker</h1>
    <p>Система для перегляду навчальних завдань.</p>

    <button id="loadButton">Load items</button>

    <p id="status" aria-live="polite">
      Натисніть кнопку, щоб завантажити завдання.
    </p>

    <ul id="taskList"></ul>
  </main>

  <script>
    const button = document.getElementById("loadButton");
    const list = document.getElementById("taskList");
    const status = document.getElementById("status");

    button.addEventListener("click", async () => {
      button.disabled = true;
      status.textContent = "Завантаження...";

      try {
        const response = await fetch("/items");

        if (!response.ok) {
          throw new Error("Помилка сервера");
        }

        const items = await response.json();
        list.replaceChildren();

        items.forEach(item => {
          const li = document.createElement("li");
          li.textContent = item.name;
          list.appendChild(li);
        });

        status.textContent =
          `Завантажено завдань: ${items.length}`;
      } catch (error) {
        status.textContent = "Не вдалося завантажити завдання.";
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
