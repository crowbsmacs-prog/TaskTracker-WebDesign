name: TaskTracker CI

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: API tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: node --test test/tasks.test.js

  docker:
    name: Docker image artifact
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Build Docker image
        run: docker build -t tasktracker:lab7 .

      - name: Export image
        run: docker save tasktracker:lab7 | gzip > tasktracker-lab7.tar.gz

      - name: Upload Docker artifact
        uses: actions/upload-artifact@v7
        with:
          name: tasktracker-docker-image
          path: tasktracker-lab7.tar.gz
          if-no-files-found: error
          retention-days: 7
