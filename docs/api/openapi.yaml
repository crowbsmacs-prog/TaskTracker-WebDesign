
openapi: 3.0.3

info:
  title: TaskTracker API
  version: 1.0.0
  description: API для роботи із завданнями

servers:
  - url: http://localhost:3000

paths:
  /health:
    get:
      summary: Перевірка роботи сервера
      responses:
        "200":
          description: Сервер працює
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok

  /tasks:
    get:
      summary: Отримати всі завдання
      responses:
        "200":
          description: Список завдань
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Task"

    post:
      summary: Створити завдання
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTask"
      responses:
        "201":
          description: Завдання створено
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "400":
          $ref: "#/components/responses/BadRequest"

  /tasks/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          minimum: 1

    get:
      summary: Отримати завдання за ID
      responses:
        "200":
          description: Знайдене завдання
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "404":
          $ref: "#/components/responses/NotFound"

    patch:
      summary: Оновити завдання
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTask"
      responses:
        "200":
          description: Завдання оновлено
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

    delete:
      summary: Видалити завдання
      responses:
        "204":
          description: Завдання видалено
        "404":
          $ref: "#/components/responses/NotFound"

components:
  schemas:
    Task:
      type: object
      required:
        - id
        - title
        - status
      properties:
        id:
          type: integer
          example: 1
        title:
          type: string
          example: Виконати лабораторну
        status:
          type: string
          enum:
            - pending
            - in_progress
            - done
          example: pending

    CreateTask:
      type: object
      required:
        - title
      properties:
        title:
          type: string
          minLength: 1
          example: Вивчити JavaScript

    UpdateTask:
      type: object
      minProperties: 1
      properties:
        title:
          type: string
          minLength: 1
        status:
          type: string
          enum:
            - pending
            - in_progress
            - done

    ErrorResponse:
      type: object
      required:
        - error
        - code
        - details
      properties:
        error:
          type: string
          example: ValidationError
        code:
          type: string
          example: TITLE_REQUIRED
        details:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              message:
                type: string

  responses:
    BadRequest:
      description: Некоректні дані
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    NotFound:
      description: Завдання не знайдено
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
